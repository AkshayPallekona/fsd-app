<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Rental Portal</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="container">
    <div class="form-card">
      <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; color: var(--color-primary);">Forgot Password</h1>
      <p style="color: var(--color-text-muted); margin-bottom: 1.5rem;">Enter your email and we'll send a password reset link.</p>

      <div id="alert-box" role="alert" style="display: none; margin-bottom: 1rem;" class="form-error"></div>
      <div id="success-box" role="status" style="display: none; margin-bottom: 1rem; color: var(--color-success); font-weight: 500;"></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" required autocomplete="email" placeholder="john@example.com">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Send Reset Link</button>
      </form>

      <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--color-text-muted);">
        Remember your password? <a href="/pages/login.html">Back to Sign In</a>
      </p>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="/assets/js/layout.js"></script>
  <script type="module" src="/pages/forgot-password.js"></script>
</body>
</html>
