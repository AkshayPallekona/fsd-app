<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Rental Portal</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="container">
    <div class="form-card">
      <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; color: var(--color-primary);">Join Rental Portal</h1>
      <p style="color: var(--color-text-muted); margin-bottom: 1.5rem;">Connect with property owners or list your real estate.</p>

      <div id="alert-box" role="alert" style="display: none; margin-bottom: 1rem;" class="form-error"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" required minlength="2" maxlength="100" autocomplete="name" placeholder="John Doe">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" required autocomplete="email" placeholder="john@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required minlength="8" autocomplete="new-password">
          <p class="form-help">Must be ≥ 8 characters with at least one uppercase letter, one lowercase letter, and one number.</p>
        </div>

        <div class="form-group">
          <label for="role">Account Type</label>
          <select id="role" class="form-control">
            <option value="seeker">Tenant / Seeker (Looking for a home)</option>
            <option value="owner">Property Owner / Agent (Listing properties)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number (Optional)</label>
          <input type="tel" id="phone" class="form-control" autocomplete="tel" placeholder="+1 (555) 000-0000">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Create Account</button>
      </form>

      <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--color-text-muted);">
        Already have an account? <a href="/pages/login.html">Sign in here</a>
      </p>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="/assets/js/layout.js"></script>
  <script type="module" src="/pages/register.js"></script>
</body>
</html>
