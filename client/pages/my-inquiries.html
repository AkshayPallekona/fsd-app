<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Inquiries - Rental Portal</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="container">
    <div class="page-header">
      <h1>My Inquiries & Viewing Bookings</h1>
      <p>Track the status of your messages and scheduled property tours.</p>
    </div>

    <div class="table-responsive">
      <table class="table" aria-label="My Inquiries">
        <thead>
          <tr>
            <th>Property</th>
            <th>Type</th>
            <th>My Message</th>
            <th>Schedule / Date</th>
            <th>Owner Response</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="inquiries-tbody">
          <!-- Populated dynamically -->
        </tbody>
      </table>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="/assets/js/layout.js"></script>
  <script type="module" src="/pages/my-inquiries.js"></script>
</body>
</html>
