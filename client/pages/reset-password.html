<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - Rental Portal</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="container">
    <div class="form-card">
      <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; color: var(--color-primary);">Set New Password</h1>
      <p style="color: var(--color-text-muted); margin-bottom: 1.5rem;">Enter a new strong password for your account.</p>

      <div id="alert-box" role="alert" style="display: none; margin-bottom: 1rem;" class="form-error"></div>
      <div id="success-box" role="status" style="display: none; margin-bottom: 1rem; color: var(--color-success); font-weight: 500;"></div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" class="form-control" required minlength="8" autocomplete="new-password">
          <p class="form-help">Must be ≥ 8 characters with at least one uppercase letter, one lowercase letter, and one number.</p>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm New Password</label>
          <input type="password" id="confirm-password" class="form-control" required minlength="8" autocomplete="new-password">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Update Password</button>
      </form>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="/assets/js/layout.js"></script>
  <script type="module" src="/pages/reset-password.js"></script>
</body>
</html>
